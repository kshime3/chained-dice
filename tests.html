<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chained Dice Tests</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1b1b1b; color: #f2f2f2; padding: 16px; }
    .pass { color: #4cd964; }
    .fail { color: #ff5c5c; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Rule checks</h1>
  <p id="summary"></p>
  <ul id="list"></ul>

  <script src="js/config.js"></script>
  <script src="js/dice.js"></script>
  <script src="js/bets.js"></script>
  <script src="js/crew.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/perks.js"></script>
  <script src="js/crafting.js"></script>
  <script src="js/comps.js"></script>
  <script src="js/unlocks.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/shift.js"></script>
  <script>
    // Tests use fixed numbers, so tuning config.js doesn't break them.
    CONFIG.shifts[0] = { cash: 200, debt: 2000, minBet: 5 };
    // Card numbers these checks were written for (config.js may be tuned differently).
    Object.assign(CONFIG, { hotHandPerWin: 0.5, rattlesnakeMult: 1, snakeEyesBonusPct: 0.1, luckySevenBonusPct: 0.05, muggsyNextShooterX: 2,
      greenDiceInterestStep: 0.005, wrongWayExtra: 0.5, deesLedgerExtra: 0.5, jinxShadowX: 2, highRollerX: 2,
      leftysGloveMult: 0, ghostStoryMult: 0, frontOfLineMult: 0 });
    CONFIG.saveProgress = false; // never touch the player's saved unlocks
    CONFIG.unlockEverything = true; // older checks expect every card, comp and crew member
    CONFIG.startingCrew = 6; // older checks expect the full table; the 3-seat start is checked below
    CONFIG.payAfterFirstShooter = false; // most checks pay at any Break; the rule has its own checks below
    CONFIG.carryOverShare = 1; // keep all leftover money in most checks; the dealer's cut has its own checks below
    const debtState = (debt) => { const st = newShiftState(); st.debt = debt; return st; };
    CONFIG.interestRate = 0.05;

    // Each check prints a green ✔ or a red ✘.
    let passed = 0, failed = 0;
    function check(label, actual, expected) {
      const ok = JSON.stringify(actual) === JSON.stringify(expected);
      ok ? passed++ : failed++;
      const li = document.createElement("li");
      li.className = ok ? "pass" : "fail";
      li.textContent = (ok ? "✔ " : "✘ ") + label + (ok ? "" : "  (got " + JSON.stringify(actual) + ")");
      document.getElementById("list").appendChild(li);
    }

    // Field, $10 bet
    check("Field: 2 pays double", resolveField(10, 2), { outcome: "win", winnings: 20 });
    for (const t of [3, 4, 9, 10, 11]) check("Field: " + t + " pays even", resolveField(10, t), { outcome: "win", winnings: 10 });
    check("Field: 12 pays triple", resolveField(10, 12), { outcome: "win", winnings: 30 });
    for (const t of [5, 6, 7, 8]) check("Field: " + t + " loses", resolveField(10, t).outcome, "lose");

    // Pass Line come-out (point is null), $10 bet
    for (const t of [7, 11]) check("Pass come-out: " + t + " wins $10", resolvePassLine(10, t, null), { outcome: "win", winnings: 10 });
    for (const t of [2, 3, 12]) check("Pass come-out: " + t + " loses", resolvePassLine(10, t, null).outcome, "lose");
    for (const t of [4, 5, 6, 8, 9, 10]) check("Come-out: " + t + " sets the point", nextPoint(null, t), t);
    for (const t of [2, 3, 7, 11, 12]) check("Come-out: " + t + " sets no point", nextPoint(null, t), null);

    // Pass Line with a point of 6, $10 bet
    check("Point 6: rolling 6 wins $10", resolvePassLine(10, 6, 6), { outcome: "win", winnings: 10 });
    check("Point 6: rolling 7 loses (seven out)", resolvePassLine(10, 7, 6).outcome, "lose");
    for (const t of [2, 3, 4, 5, 8, 9, 10, 11, 12]) check("Point 6: rolling " + t + " decides nothing", resolvePassLine(10, t, 6).outcome, "none");
    check("Point 6: hitting it ends the point", nextPoint(6, 6), null);
    check("Point 6: a 7 ends the point", nextPoint(6, 7), null);
    check("Point 6: an 11 keeps the point", nextPoint(6, 11), 6);

    // Odds pay true odds, rounded down
    check("Odds $10 on 4 pays $20 (2:1)", resolveOdds(10, 4, 4).winnings, 20);
    check("Odds $10 on 10 pays $20 (2:1)", resolveOdds(10, 10, 10).winnings, 20);
    check("Odds $10 on 5 pays $15 (3:2)", resolveOdds(10, 5, 5).winnings, 15);
    check("Odds $5 on 9 pays $7 (3:2, rounded down from $7.50)", resolveOdds(5, 9, 9).winnings, 7);
    check("Odds $10 on 6 pays $12 (6:5)", resolveOdds(10, 6, 6).winnings, 12);
    check("Odds $5 on 8 pays $6 (6:5)", resolveOdds(5, 8, 8).winnings, 6);
    check("Odds lose on a seven out", resolveOdds(10, 7, 6).outcome, "lose");
    check("Odds: other numbers decide nothing", resolveOdds(10, 9, 6).outcome, "none");

    // Odds limits (3-4-5x) on a $10 Pass Line
    check("Max odds on 4 is $30 (3x)", maxOdds(10, 4), 30);
    check("Max odds on 5 is $40 (4x)", maxOdds(10, 5), 40);
    check("Max odds on 6 is $50 (5x)", maxOdds(10, 6), 50);

    // Whole rolls
    check("No bets: nothing to settle", resolveRoll({ pass: 0, odds: 0, field: 0 }, 7, null), []);
    const so = resolveRoll({ pass: 10, odds: 20, field: 5 }, 7, 6);
    check("Seven out: Pass, Odds and Field all lose", so.map((r) => r.bet + ":" + r.outcome), ["pass:lose", "odds:lose", "field:lose"]);
    const hit = resolveRoll({ pass: 10, odds: 20, field: 5 }, 4, 4);
    check("Hit point 4: Pass +$10, Odds +$40, Field +$5", hit.map((r) => r.bet + ":" + r.winnings), ["pass:10", "odds:40", "field:5"]);
    check("Odds come back to you after winning; Pass stays up", hit.map((r) => r.staysUp), [true, false, true]);

    // Shift rules
    const s1 = newShiftState();
    check("Shift starts: $200 cash, $0 paid, shooter 1, on a Dealer break", [s1.cash, s1.deposited, s1.shooterIndex, s1.onBreak], [200, 0, 0, true]);
    check("Can't roll a come-out with no Pass Line", canRoll(s1), false);
    s1.cash = 195; s1.bets.pass = 5;
    check("Can roll with $5 on the Pass Line", canRoll(s1), true);

    // Broke
    const broke = newShiftState(); broke.cash = 4;
    check("$4 total on a come-out is broke", isBroke(broke), true);
    const notBroke = newShiftState(); notBroke.cash = 0; notBroke.bets.field = 5;
    check("$0 cash but $5 on the Field is not broke", isBroke(notBroke), false);
    const pointOn = newShiftState(); pointOn.cash = 0; pointOn.bets.pass = 5; pointOn.point = 6;
    check("$0 cash with a point on is not broke", isBroke(pointOn), false);
    const paidUp = newShiftState(); paidUp.cash = 3; paidUp.deposited = 500;
    check("Deposits don't count toward covering a bet", isBroke(paidUp), true);

    // Auto-moving money to the Pass Line
    const mv = newShiftState(); mv.cash = 2; mv.bets.field = 10;
    check("Cash $2 + Field $10: $5 Pass moves $3 from Field", fundPassLine(mv, 5), [{ from: "field", amount: 3 }]);
    check("...leaving cash $0, Field $7, Pass $5", [mv.cash, mv.bets.field, mv.bets.pass], [0, 7, 5]);
    const mv2 = newShiftState(); mv2.cash = 50;
    check("Enough in cash: nothing moved", fundPassLine(mv2, 25), []);
    const mv3 = newShiftState(); mv3.cash = 2; mv3.bets.field = 2;
    check("Can't cover $5 at all: refused, nothing changes", [fundPassLine(mv3, 5), mv3.cash, mv3.bets.field], [null, 2, 2]);

    // Paying the dealer
    const d = newShiftState();
    check("Pay $50: $50 paid", deposit(d, 50), 50);
    check("...cash $150, paid $50, still owe $1,950", [d.cash, d.deposited, amountOwed(d)], [150, 50, 1950]);
    check("Paying everything keeps $5 back for the Pass Line", deposit(d, 999), 145);
    check("...cash $5 left", d.cash, 5);
    check("Cash at $5: nothing more can be paid", deposit(d, 5), 0);
    const d3 = newShiftState(); d3.cash = 100; d3.deposited = 1900;
    check("Paying off the whole debt may use every last dollar", [deposit(d3, 100), d3.cash, d3.status], [100, 0, "won"]);
    const d2 = newShiftState(); d2.cash = 300; d2.deposited = 1900;
    check("Owe $100 with $300: only $100 is paid", deposit(d2, 300), 100);
    check("Paying in full wins at once, extra stays in cash", [d2.status, d2.cash], ["won", 200]);

    // Turns and breaks
    const so1 = newShiftState(); so1.onBreak = false; so1.cash = 100;
    afterRoll(so1, true);
    check("A seven-out passes the dice and starts a Dealer break", [so1.shooterIndex, so1.onBreak, so1.status], [1, true, "playing"]);
    endBreak(so1);
    check("Leaving the break: next shooter plays", [so1.onBreak, so1.status], [false, "playing"]);

    const last = newShiftState(); last.onBreak = false; last.cash = 5000; last.shooterIndex = 5;
    afterRoll(last, true);
    check("Last shooter sevens out: a final Dealer break, not a fall yet", [isFinalBreak(last), last.onBreak, last.status], [true, true, "playing"]);
    deposit(last, 5000);
    check("Paying in full on the final break wins", last.status, "won");

    const short = newShiftState(); short.cash = 500; short.shooterIndex = 6;
    endBreak(short);
    check("Leaving the final break still owing: fall", short.status, "fell-short");

    const brokeRoll = newShiftState(); brokeRoll.onBreak = false; brokeRoll.cash = 0;
    afterRoll(brokeRoll, false);
    check("Going broke on a come-out: fall", brokeRoll.status, "fell-broke");
    // Interest on paid money
    const in1 = newShiftState(); in1.onBreak = false; in1.cash = 50; in1.deposited = 100;
    afterRoll(in1, true);
    check("Interest: $100 paid -> +$5 into the cash at the Break", [in1.lastInterest, in1.cash], [5, 55]);
    const in2 = newShiftState(); in2.deposited = 30;
    check("Interest rounds down: $30 paid -> $1", payInterest(in2), 1);
    check("Nothing paid -> no interest", payInterest(newShiftState()), 0);
    const in3 = newShiftState(); in3.onBreak = false; in3.cash = 0; in3.deposited = 100; in3.shooterIndex = 1;
    afterRoll(in3, true);
    check("Interest can save you: $0 cash + $5 interest -> Break, not a fall", [in3.status, in3.cash], ["playing", 5]);

    const zero = newShiftState(); zero.onBreak = false; zero.cash = 0; zero.shooterIndex = 1;
    afterRoll(zero, true);
    check("Seven-out with $0: fall at once, no Dealer break", [zero.status, zero.onBreak], ["fell-broke", false]);
    const low = newShiftState(); low.onBreak = false; low.cash = 20; low.shooterIndex = 1;
    afterRoll(low, true);
    check("Seven-out with $20: Dealer break as usual", [low.status, low.onBreak], ["playing", true]);
    const brokeBreak = newShiftState(); brokeBreak.cash = 3; brokeBreak.shooterIndex = 2;
    endBreak(brokeBreak);
    check("Leaving a break unable to cover $5: fall", brokeBreak.status, "fell-broke");

    // Crew dice odds (rounded to 0.1%)
    const pct = (p) => Math.round(p * 1000) / 10;
    const oddsFor = (name) => diceOdds(diceForShooter(name));
    check("Normal dice: 7 is 16.7%", pct(diceOdds()[7]), 16.7);
    check("Hot Rod and You: normal dice", [pct(oddsFor("Hot Rod")[7]), pct(oddsFor("You")[7])], [16.7, 16.7]);
    check("Lefty: 7 is 16%", pct(oddsFor("Lefty")[7]), 16);
    check("Lefty: 11 and 12 are impossible", [oddsFor("Lefty")[11], oddsFor("Lefty")[12]], [0, 0]);
    check("Dealer Dee: 7 is 14.3% (5 of 35 combos)", pct(oddsFor("Dealer Dee")[7]), 14.3);
    check("Jinx: 7 is 22.2%", pct(oddsFor("Jinx")[7]), 22.2);
    check("Jinx: nothing above 8", [9, 10, 11, 12].map((t) => oddsFor("Jinx")[t]), [0, 0, 0, 0]);
    check("Ghost: right die is evens-only or odds-only", ["2,4,6", "1,3,5"].includes(diceForShooter("Ghost").right.join()), true);
    check("Point before 7 on normal dice: 6 is 45.5%", pct(pointBeforeSeven(diceOdds(), 6)), 45.5);
    let deeBanned = false;
    const dee = diceForShooter("Dealer Dee");
    for (let i = 0; i < 5000; i++) { const r = rollDice(dee); if (r.dice[0] === 1 && r.dice[1] === 6) deeBanned = true; }
    check("Dealer Dee: 5,000 rolls, never left 1 + right 6", deeBanned, false);
    let jinxHigh = false;
    for (let i = 0; i < 5000; i++) { if (rollDice(diceForShooter("Jinx")).total > 8) jinxHigh = true; }
    check("Jinx: 5,000 rolls, never above 8", jinxHigh, false);
    const sh = newShiftState(); sh.onBreak = false; sh.cash = 100;
    afterRoll(sh, true);
    check("After a seven-out, the next shooter's dice are loaded (Lefty -> Dee)", sh.dice.bannedPairs, [[1, 6]]);

    // Mult and crew synergies
    const m = [{ bet: "pass", outcome: "win", winnings: 10 }, { bet: "field", outcome: "win", winnings: 5 }, { bet: "odds", outcome: "lose", winnings: 0 }];
    applyMult(m, 2.5);
    check("Mult 2.5x: $10 win pays $25, $5 win pays $12 (rounded down)", m.map((r) => r.winnings), [25, 12, 0]);

    const atIndex = (i) => { const st = newShiftState(); st.onBreak = false; st.cash = 100; st.shooterIndex = i; setupTurn(st, null, 1); return st; };
    const rod = atIndex(2);
    applyCrewEffects(rod, [{ bet: "pass", outcome: "win" }], false);
    applyCrewEffects(rod, [{ bet: "field", outcome: "win" }], false);
    applyCrewEffects(rod, [{ bet: "field", outcome: "lose" }], false);
    check("Hot Rod: two winning rolls and a loss -> 3x", rod.mult, 3);
    check("...and the mult lists the reason once: \"Hot Rod streak: +2x\"", multReasons(rod), ["Hot Rod streak: +2x"]);

    const rod2 = atIndex(2); rod2.cash = 100;
    applyCrewEffects(rod2, [{ bet: "pass", outcome: "lose", amount: 10 }, { bet: "odds", outcome: "lose", amount: 20 }, { bet: "field", outcome: "lose", amount: 5 }], true);
    check("Hot Rod's seven-out costs double: Pass $10 + Odds $20 -> another $30", rod2.cash, 70);
    applyCrewEffects(rod2, [{ bet: "pass", outcome: "lose", amount: 10 }], true);
    check("...only the first time each shift", rod2.cash, 70);
    const rod3 = atIndex(2); rod3.cash = 12;
    applyCrewEffects(rod3, [{ bet: "pass", outcome: "lose", amount: 50 }], true);
    check("...but never below the $5 minimum", rod3.cash, 5);

    const jinx = atIndex(3); setupTurn(jinx, "Hot Rod", 5);
    check("Mentor: Hot Rod ends at 5x -> Jinx starts at 3x", jinx.mult, 3);
    const jinx2 = atIndex(3); setupTurn(jinx2, "Hot Rod", 1);
    check("Mentor: Hot Rod with no streak -> Jinx starts at 1x", jinx2.mult, 1);

    const ghost = atIndex(4); setupTurn(ghost, "Jinx", 1);
    check("Cold Table: after Jinx, Ghost starts at 0.5x", [ghost.mult, ghost.coldTable], [0.5, true]);
    applyCrewEffects(ghost, [{ bet: "field", outcome: "lose" }], false);
    check("...a loss doesn't lift it", ghost.mult, 0.5);
    applyCrewEffects(ghost, [{ bet: "pass", outcome: "win" }], false);
    check("...the first win lifts it back to 1x", [ghost.mult, ghost.coldTable], [1, false]);

    const flow = newShiftState(); flow.onBreak = false; flow.cash = 100; flow.shooterIndex = 2; flow.mult = 4;
    afterRoll(flow, true);
    check("Full flow: Hot Rod sevens out at 4x -> Jinx starts at 2.5x", [flow.crew[flow.shooterIndex], flow.mult], ["Jinx", 2.5]);

    // Shop: prices are a share of the debt, rounded to $5
    check("Common = 5% of $2,000 = $100", cardPrice(debtState(2000), "hotHand"), 100);
    check("Uncommon = 10% of $2,000 = $200", cardPrice(debtState(2000), "redDice"), 200);
    check("At a $200 debt: Common $10, Uncommon $20", [cardPrice(debtState(200), "snakeEyes"), cardPrice(debtState(200), "muggsy")], [10, 20]);
    check("Selling gives back half", sellPrice(debtState(2000), "hotHand"), 50);

    const shop = newShiftState();
    check("A new shift has 3 different cards for sale", [shop.stock.length, new Set(shop.stock).size], [3, 3]);
    let ownedInStock = false;
    for (let i = 0; i < 200; i++) {
      const st = newShiftState(); st.cards = ["hotHand", "snakeEyes", "luckySeven", "rattlesnake", "redDice"];
      if (newStock(st).some((id) => st.cards.includes(id))) ownedInStock = true;
    }
    check("Cards you own never show up in the stock", ownedInStock, false);

    const b1 = newShiftState(); b1.cash = 300; b1.stock = ["hotHand", "redDice", "pity"];
    check("Buy Hot Hand ($100)", [buyCard(b1, 0), b1.cash, b1.cards, b1.stock[0]], ["ok", 200, ["hotHand"], null]);
    check("Buying the same slot again: sold out", buyCard(b1, 0), "empty");
    check("Can't buy if it would leave less than $5", [buyCard(b1, 1), b1.cash], ["money", 200]);
    b1.cash = 205;
    check("...exactly $5 left is fine", [buyCard(b1, 1), b1.cash], ["ok", 5]);
    const b2 = newShiftState(); b2.cash = 5000; b2.cards = ["hotHand", "snakeEyes", "luckySeven", "rattlesnake", "redDice"]; b2.stock = ["pity", null, null];
    check("5 cards: slots are full", buyCard(b2, 0), "full");
    check("Sell Snake Eyes for $50", [sellCard(b2, "snakeEyes"), b2.cards.length, b2.cash], [50, 4, 5050]);
    const sf = newShiftState(); sf.cash = 1000;
    check("Shuffle costs 5% of the debt every time ($100, then $100)", [shuffleCost(sf), shuffleStock(sf), shuffleCost(sf), sf.cash], [100, true, 100, 900]);
    check("Shop is closed before the first shooter", isShopOpen(newShiftState()), false);
    const open1 = newShiftState(); open1.shooterIndex = 1;
    check("Shop opens after the first shooter", isShopOpen(open1), true);

    // Cards in play. Helper: a state that owns the given cards.
    const withCards = (...ids) => { const st = newShiftState(); st.onBreak = false; st.cash = 1000; st.cards = ids; return st; };
    const passLose = (amt) => [{ bet: "pass", outcome: "lose", amount: amt, winnings: 0 }];

    const rd = withCards("redDice");
    const rdRes = resolveRoll({ pass: 10, odds: 0, field: 0 }, 3, null);
    applyCardsBeforePayout(rd, rdRes, 3, null);
    check("Red Dice: come-out 3 wins the $10 Pass Line", [rdRes[0].outcome, rdRes[0].winnings], ["win", 10]);
    const noRd = resolveRoll({ pass: 10, odds: 0, field: 0 }, 3, null);
    applyCardsBeforePayout(withCards(), noRd, 3, null);
    check("Without Red Dice, come-out 3 still loses", noRd[0].outcome, "lose");

    const oa = withCards("oddsAddict");
    const oaRes = resolveRoll({ pass: 10, odds: 10, field: 0 }, 4, 4);
    applyCardsBeforePayout(oa, oaRes, 4, 4);
    check("Odds Addict: $10 Odds on 4 pays $30 instead of $20", oaRes.find((r) => r.bet === "odds").winnings, 30);

    const pt = withCards("pity"); pt.bets.pass = 10; // Pity needs a Pass Line bet
    const ptRes = resolveRoll({ pass: 10, odds: 20, field: 5 }, 7, 6);
    const ptOut = applyCardsBeforePayout(pt, ptRes, 7, 6);
    check("Pity: first seven-out ignored; only the Field loses", [ptOut.pity, ptRes.map((r) => r.bet)], [true, ["field"]]);
    const ptRes2 = resolveRoll({ pass: 10, odds: 0, field: 0 }, 7, 6);
    check("...but only once a shift", applyCardsBeforePayout(pt, ptRes2, 7, 6).pity, false);

    const se = withCards("snakeEyes", "rattlesnake");
    applyCardsAfterRoll(se, [], 2, 6, false);
    check("Snake Eyes: a 2 pays 10% of the debt ($200)", se.cash, 1200);
    check("Rattlesnake: a 2 adds +1x mult", se.mult, 2);
    check("...and shows as a mult reason", multReasons(se), ["Rattlesnake: +1x"]);

    const ls = withCards("luckySeven");
    applyCardsAfterRoll(ls, [], 7, null, false);
    check("Lucky Seven: a come-out 7 pays 5% ($100)", ls.cash, 1100);
    applyCardsAfterRoll(ls, [], 7, 6, true);
    check("...but not a seven-out", ls.cash, 1100);

    const hh = withCards("hotHand");
    applyCardsAfterRoll(hh, [{ bet: "field", outcome: "win" }], 3, null, false);
    applyCardsAfterRoll(hh, [{ bet: "field", outcome: "win" }], 4, null, false);
    check("Hot Hand: 2 wins in a row -> 2x mult", effectiveMult(hh), 2);
    applyCardsAfterRoll(hh, [], 5, 4, false);
    check("...a roll that decides nothing keeps the streak", effectiveMult(hh), 2);
    applyCardsAfterRoll(hh, [{ bet: "field", outcome: "lose", amount: 5 }], 5, 4, false);
    check("...a losing roll resets it", effectiveMult(hh), 1);

    const mg = withCards("muggsy");
    mg.point = 6; applyCardsAfterRoll(mg, [], 6, null, false); // point set
    applyCardsAfterRoll(mg, passLose(10), 7, 6, true);           // seven on the very next roll
    check("Muggsy: point-7 charges another $10", mg.cash, 990);
    const mgOdds = withCards("muggsy");
    mgOdds.point = 6; applyCardsAfterRoll(mgOdds, [], 6, null, false);
    applyCardsAfterRoll(mgOdds, [{ bet: "pass", outcome: "lose", amount: 10 }, { bet: "odds", outcome: "lose", amount: 50 }], 7, 6, true);
    check("Muggsy charges the Pass Line only, not Odds ($10, not $60)", mgOdds.cash, 990);
    mg.shooterIndex = 1; setupTurn(mg, "Lefty", 1);
    check("...and the next shooter's winnings are x2", effectiveMult(mg), 2);
    const mg2 = withCards("muggsy");
    mg2.point = 6; applyCardsAfterRoll(mg2, [], 6, null, false);
    applyCardsAfterRoll(mg2, [], 9, 6, false);
    applyCardsAfterRoll(mg2, passLose(10), 7, 6, true);
    check("Muggsy: a 7 two rolls after the point is a normal seven-out", [mg2.cash, mg2.muggsyPending], [1000, false]);

    // 5b-1 dice cards
    const du = withCards("doubleUp"); du.dice = diceForShooter("Hot Rod"); // normal dice
    const duOdds = diceOdds(currentDice(du));
    check("Double Up, normal dice: 7 drops to 14.3% (6 of 42)", pct(duOdds[7]), 14.3);
    check("Double Up: a 2 goes from 2.8% to 4.8% (2 of 42)", pct(duOdds[2]), 4.8);
    const plainState = withCards(); plainState.dice = diceForShooter("Hot Rod");
    const plainDice = diceOdds(currentDice(plainState));
    check("Without Double Up, dice are unchanged (7 is 16.7%)", pct(plainDice[7]), 16.7);
    const duDee = withCards("doubleUp"); duDee.dice = diceForShooter("Dealer Dee");
    check("Double Up stacks with Dee's sticky dice: 7 is 5 of 41 = 12.2%", pct(diceOdds(currentDice(duDee))[7]), 12.2);
    const lefty = withCards("doubleUp"); lefty.dice = diceForShooter("Lefty");
    check("Double Up never makes Lefty roll a 12", diceOdds(currentDice(lefty))[12], 0);

    const dc = withCards("doublesCharm");
    check("Doubles Charm: rolls 1 and 2 are normal, roll 3 is a pair", [pairDue(dc), (dc.turnRolls = 1, pairDue(dc)), (dc.turnRolls = 2, pairDue(dc))], [false, false, true]);
    check("...then roll 6", [(dc.turnRolls = 4, pairDue(dc)), (dc.turnRolls = 5, pairDue(dc))], [false, true]);
    let allPairs = true, leftySix = false;
    const leftyDice = diceForShooter("Lefty");
    for (let i = 0; i < 2000; i++) {

    const dc1 = newShiftState(); dc1.shooterIndex = 1; dc1.onBreak = true; dc1.comps = ["chisel"];
    const msg = useComp(dc1, 0, { die: "left", index: 0, value: 6 });
    check("Chisel your left 1 into a 6: saved, comp used", [dc1.myDice.left, dc1.comps.length, msg !== null], [[6, 2, 3, 4, 5, 6], 0, true]);
    check("...one die alone doesn't change your 7s (still 6 of 36)", Math.round(sevenWays(dc1.myDice)), 6);
    const dcOdds = diceOdds({ left: dc1.myDice.left, right: dc1.myDice.right });
    check("...but 12s double (2/36) and 2s become impossible", [Math.round(dcOdds[12] * 36), dcOdds[2]], [2, 0]);
    editFace(dc1, "right", 0, 6);
    check("Edit both dice (right 1 -> 6 too): now only 4 ways to roll 7", Math.round(sevenWays(dc1.myDice)), 4);
    const dc2 = newShiftState(); dc2.myDice = { left: [6, 6, 6, 6, 6, 6], right: [1, 2, 3, 3, 3, 3] };
    check("7-floor: an edit that leaves fewer than 2 ways to roll 7 is refused", [editFace(dc2, "right", 0, 3), dc2.myDice.right[0]], ["seven-floor", 1]);
    const dc3 = newShiftState(); dc3.shooterIndex = 5; dc3.myDice.left = [6, 2, 3, 4, 5, 6]; // You shoot next
    editFace(dc3, "right", 0, 6);
    check("If you're next to shoot, your new dice apply straight away", dc3.dice.right, [6, 2, 3, 4, 5, 6]);
    const dc4 = newShiftState(); dc4.shooterIndex = 4; dc4.myDice.right = [6, 6, 3, 4, 5, 6]; dc4.prevShooterMult = 1;
    afterRoll(Object.assign(dc4, { onBreak: false, cash: 100 }), true); // Ghost sevens out -> your turn
    check("Your turn uses your crafted dice", dc4.dice.right, [6, 6, 3, 4, 5, 6]);
    const dc5 = newShiftState(); dc5.myDice.left = [6, 6, 3, 4, 5, 6]; dc5.status = "won";
    check("Crafted dice carry into the next shift", nextShift(dc5).myDice.left, [6, 6, 3, 4, 5, 6]);
    const dcGone = newShiftState(); dcGone.onBreak = true; dcGone.roster = dcGone.crew = ["Lefty", "Jinx"];
    check("Can't edit when You aren't at the table", compBlocked(dcGone, "nudge") !== "", true);

    {
    // Milestone 10: crew cards, "You" cards, hiring
    const at = (name, ...cards) => { const st = newShiftState(); st.onBreak = false; st.cash = 1000; st.cards = cards; st.shooterIndex = st.crew.indexOf(name); setupTurn(st, st.crew[st.shooterIndex - 1] || null, 1); return st; };
    check("Lefty's Glove: Lefty's 7s go from 16% to 16.7% (right die gets its 6)", pct(diceOdds(at("Lefty", "leftysGlove").dice)[7]), 16.7);
    const ledger = at("Dealer Dee", "deesLedger");
    const ledgerRes = resolveRoll({ pass: 10, odds: 10, dont: 0, lay: 0, field: 0 }, 4, 4);
    applyCardsBeforePayout(ledger, ledgerRes, 4, 4);
    check("Dee's Ledger: $10 Odds on 4 pays $30 on Dee's turn", ledgerRes.find((r) => r.bet === "odds").winnings, 30);
    const lighter = at("Hot Rod", "rodsLighter");
    applyCrewEffects(lighter, [{ bet: "pass", outcome: "win" }], false, false);
    check("Rod's Lighter: Hot Rod +1.5x per win", lighter.mult, 2.5);
    const rodOut = at("Hot Rod", "rodsLighter"); rodOut.cash = 100;
    applyCrewEffects(rodOut, [{ bet: "pass", outcome: "lose", amount: 20 }], true, false);
    check("...and his seven-out doesn't cost double", rodOut.cash, 100);
    const shadow = at("Jinx", "jinxShadow");
    const shadowRes = resolveRoll({ pass: 0, odds: 0, dont: 10, lay: 0, field: 0 }, 3, null);
    applyCardsBeforePayout(shadow, shadowRes, 3, null);
    check("Jinx's Shadow: Don't Pass $10 pays $20 when Jinx shoots", shadowRes[0].winnings, 20);
    const ghostS = newShiftState(); ghostS.cards = ["ghostStory"]; ghostS.ghostPick = "odds";
    check("Ghost Story: you choose Ghost's die (odds)", diceForShooter("Ghost", ghostS).right, [1, 3, 5]);

    const enc = newShiftState(); enc.cards = ["encore"]; enc.status = "won";
    const enc2 = nextShift(enc);
    check("Encore: next shift's order ends with an extra turn for You", enc2.crew, ["Lefty", "Dealer Dee", "Hot Rod", "Jinx", "Ghost", "You", "You"]);
    const front = newShiftState(); front.cards = ["frontOfLine"]; front.status = "won";
    check("Front of the Line: You shoot first next shift", nextShift(front).crew[0], "You");
    const encMid = newShiftState(); encMid.shooterIndex = 6; encMid.onBreak = true; // final Break
    encMid.cards = ["encore"]; addEncoreTurn(encMid);
    check("Encore bought at the final Break: your extra turn is next, not the final judgment", [isFinalBreak(encMid), encMid.crew[6]], [false, "You"]);
    const hr = at("You", "highRoller");
    check("High Roller: x2 mult on your own turn", effectiveMult(hr), 2);
    check("...but not on anyone else's", effectiveMult(at("Lefty", "highRoller")), 1);
    const sl = newShiftState(); sl.cards = ["sleightOfHand"]; sl.myDice.left = [6, 6, 3, 4, 5, 6]; sl.crew = ["You", "Jinx"]; sl.shooterIndex = 1;
    setupTurn(sl, "You", 1);
    check("Sleight of Hand: the shooter after you rolls your dice", sl.dice.left, [6, 6, 3, 4, 5, 6]);
    let lefty = false;
    for (let i = 0; i < 200; i++) { const st = newShiftState(); st.roster = st.roster.filter((n) => n !== "Lefty"); if (newStock(st).includes("leftysGlove")) lefty = true; }
    check("Crew cards aren't offered once that person has left the table", lefty, false);

    // New crew and hiring
    check("Snake rolls lots of craps: 2/3/12 = 25% (normal 11.1%)", pct(diceOdds(diceForShooter("Snake"))[2] + diceOdds(diceForShooter("Snake"))[3] + diceOdds(diceForShooter("Snake"))[12]), 25);
    check("Big Mo can still roll a 7 (11.1%)", pct(diceOdds(diceForShooter("Big Mo"))[7]), 11.1);
    const prof = newShiftState(); prof.crew.push("The Professor"); prof.shooterIndex = 6; prof.point = 6; prof.bets.pass = 10;
    check("The Professor doubles the Odds limit ($50 -> $100 on 6)", backingLimit(prof, "odds"), 100);
    const lou = newShiftState(); lou.crew.push("Lucky Lou"); lou.shooterIndex = 6;
    applyCrewEffects(lou, [{ bet: "pass", outcome: "win" }], false, true);
    check("Lucky Lou: +1x mult when he hits a point", lou.mult, 2);
    const h = newShiftState(); h.cash = 1000; h.hireOffers = ["Snake", "Big Mo"];
    check("Can't hire with every seat full (6)", hire(h, "Snake"), "full");
    removeCrew(h, "Jinx");
    check("After a Trapdoor: hire Snake for 20% of the debt", [hire(h, "Snake"), h.cash, h.roster.length], ["ok", 600, 6]);
    check("...Snake shoots last this shift", h.crew[h.crew.length - 1], "Snake");
    h.status = "won";
    check("...and keeps the seat next shift", nextShift(h).roster.includes("Snake"), true);
    }

    // House rules and pit boss challenges (Milestone 11)
    {
    const withRule = (id, extra) => { const st = newShiftState(); st.houseRule = Object.assign({ id: id }, extra || {}); return st; };
    check("No house rule on shift 1", newShiftState().houseRule, null);
    const s3 = newShiftState(); s3.shift = 3;
    check("A normal house rule from shift 3", !!pickHouseRule(s3) && !HOUSE_RULES[pickHouseRule(s3).id].boss, true);
    const s8 = newShiftState(); s8.shift = totalLinks(s8);
    check("A boss rule on the last link", HOUSE_RULES[pickHouseRule(s8).id].boss, true);
    let pw = false;
    for (let i = 0; i < 300; i++) { const st = newShiftState(); st.shift = 4; st.cards = []; if (pickHouseRule(st).id === "pitWatch") pw = true; }
    check("Pit Watch never picked when you own no cards", pw, false);
    const hs = withRule("highStakes");
    check("High Stakes: table min $5 -> $10", tableMin(hs), 10);
    const to = withRule("tightOdds"); to.point = 4; to.bets.pass = 10; to.bets.dont = 10;
    check("Tight Odds: Odds max 2x the line ($20)", backingLimit(to, "odds"), 20);
    check("Tight Odds: Lay on 4 max $40 (wins $20)", backingLimit(to, "lay"), 40);
    const si = withRule("skimmedInterest"); si.deposited = 1000;
    check("Skimmed Interest: 5% -> 2.5% ($25 on $1,000)", payInterest(si), 25);
    const mk = withRule("markup");
    check("Markup: Shuffle 1.5x", shuffleCost(mk), roundTo5(shuffleCost(newShiftState()) * 1.5));
    check("Markup: hiring 1.5x", hirePrice(mk), roundTo5(hirePrice(newShiftState()) * 1.5));
    const pwst = withRule("pitWatch", { disabled: "doublesCharm" }); pwst.cards = ["doublesCharm", "greenDice"];
    check("Pit Watch: the watched card is off, others work", [hasCard(pwst, "doublesCharm"), hasCard(pwst, "greenDice")], [false, true]);
    const hd = withRule("houseDie", { x: 3 }); hd.shooterIndex = hd.crew.indexOf("You"); setupTurn(hd);
    check("House Die: your left die always shows 3", currentDice(hd).left, [3]);
    check("...7 still possible (16.7%)", pct(diceOdds(currentDice(hd))[7]), 16.7);
    const hdNo = withRule("houseDie", { x: 1 }); hdNo.shooterIndex = hdNo.crew.indexOf("You"); hdNo.myDice = { left: [1, 2, 3, 4, 5, 6], right: [1, 2, 3, 4, 5, 5] }; setupTurn(hdNo);
    check("House Die skipped when it would leave no 7 (left 1, right has no 6)", currentDice(hdNo).left, [1, 2, 3, 4, 5, 6]);
    const hdPair = withRule("houseDie", { x: 6 }); hdPair.shooterIndex = hdPair.crew.indexOf("You"); hdPair.myDice = { left: [1, 2, 3, 4, 5, 6], right: [1, 1, 2, 3, 4, 5] }; setupTurn(hdPair); hdPair.armed.luckyPair = true;
    check("House Die skipped when a guaranteed pair can't be rolled with it", currentDice(hdPair).left.length, 6);
    check("Dark Side Only: no Pass Line", [passAllowed(withRule("darkSideOnly")), passAllowed(newShiftState())], [false, true]);
    const cd = withRule("coldDice"); cd.mult = 3;
    check("Cold Dice: mult capped at 1x", effectiveMult(cd), 1);
    const sh = withRule("sevenHeaven"); const shRes = [{ bet: "pass", amount: 10, outcome: "win", winnings: 10 }];
    applyCrewBeforePayout(sh, shRes, 7, null);
    check("Seven Heaven: come-out 7 is a tie for the Pass Line", shRes[0].outcome, "none");
    const nfl = withRule("noFreeLunch"); nfl.point = 6;
    const r1 = [{ bet: "pass", amount: 10, outcome: "win", winnings: 10 }, { bet: "odds", amount: 10, outcome: "win", winnings: 12 }];
    applyCrewBeforePayout(nfl, r1, 6, 6);
    check("No Free Lunch: first point pays nothing", [r1[0].winnings, r1[1].winnings, r1[0].outcome], [0, 0, "win"]);
    const r2 = [{ bet: "pass", amount: 10, outcome: "win", winnings: 10 }];
    applyCrewBeforePayout(nfl, r2, 6, 6);
    check("...the same shooter's second point pays", r2[0].winnings, 10);

    // Challenges
    check("No challenge on shift 1", newChallenge(newShiftState()), null);
    const ch = newShiftState(); ch.shift = 2; ch.debt = 1000; ch.cash = 100;
    ch.challenge = { id: "doubles", progress: 0, done: false, reward: "cash" };
    const info = (o) => Object.assign({ pointHit: false, total: 6, doubles: false, sevenOut: false, multUsed: 1 }, o);
    trackChallenge(ch, [], info({ doubles: true })); trackChallenge(ch, [], info({ doubles: true }));
    check("Doubles challenge: 2 of 3", [ch.challenge.progress, ch.challenge.done], [2, false]);
    check("...third doubles completes it and pays 10% of the debt", [!!trackChallenge(ch, [], info({ doubles: true })), ch.cash], [true, 200]);
    check("...and only pays once", [trackChallenge(ch, [], info({ doubles: true })), ch.cash], [null, 200]);
    const dc = newShiftState(); dc.debt = 1000; dc.challenge = { id: "hardPoint", progress: 0, done: false, reward: "debtCut" };
    trackChallenge(dc, [], info({ pointHit: true, total: 6 }));
    check("Hard point: a 6 doesn't count", dc.challenge.done, false);
    trackChallenge(dc, [], info({ pointHit: true, total: 10 }));
    check("...a 10 does: debt $1,000 -> $950", dc.debt, 950);
    const fs = newShiftState(); fs.challenge = { id: "dontWin", progress: 0, done: false, reward: "shuffle" };
    trackChallenge(fs, [{ bet: "dont", outcome: "win" }], info({}));
    check("Don't Pass win -> a free Shuffle", [fs.freeShuffles, shuffleCost(fs)], [1, 0]);
    const lh = newShiftState(); lh.challenge = { id: "longHaul", progress: 0, done: false, reward: "comp" };
    for (let i = 0; i < 5; i++) trackChallenge(lh, [], info({}));
    trackChallenge(lh, [], info({ sevenOut: true }));
    check("Long haul: a seven-out roll doesn't count", lh.challenge.progress, 5);
    trackChallenge(lh, [], info({}));
    check("...the 6th safe roll pays a free comp", lh.comps.length, 1);
    }

    // Starting with 3 seats: you, Jinx and one random crew member
    {
    CONFIG.startingCrew = 3;
    let alwaysOk = true, starters = new Set();
    for (let i = 0; i < 200; i++) {
      const st = newShiftState();
      if (st.roster.length !== 3 || !st.roster.includes("You") || !st.roster.includes("Jinx")) alwaysOk = false;
      st.roster.filter((n) => n !== "You" && n !== "Jinx").forEach((n) => starters.add(n));
    }
    check("3 seats at the start: always you and Jinx, plus one more", alwaysOk, true);
    check("...the third seat varies (all 4 other starters seen)", starters.size, 4);
    const st3 = newShiftState();
    check("Shooting order matches the seats, and the dice belong to the first shooter", [st3.crew, JSON.stringify(st3.dice) === JSON.stringify(diceForShooter(st3.crew[0], st3))], [st3.roster, true]);
    let pool = new Set();
    for (let i = 0; i < 100; i++) { const st = newShiftState(); st.hireOffers = []; newHireOffers(st).forEach((n) => pool.add(n)); }
    check("Hire offers include unseated starters, never Jinx or you", [pool.has("Lefty") || pool.has("Ghost"), pool.has("Jinx"), pool.has("You")], [true, false, false]);
    const tj = newShiftState(); tj.cash = 5000; tj.shift = 2;
    removeCrew(tj, "Jinx");
    let back = false;
    for (let i = 0; i < 100; i++) if (newHireOffers(tj).includes("Jinx")) back = true;
    check("After a Trapdoor, Jinx never comes back", [tj.roster.includes("Jinx"), back], [false, false]);
    tj.status = "won";
    const tj2 = nextShift(tj);
    check("...even in later shifts", [tj2.dropped.includes("Jinx"), newHireOffers(tj2).includes("Jinx")], [true, false]);
    CONFIG.startingCrew = 6;
    }

    // Unlocks (Milestone 12). Uses an in-memory profile; your saved progress is never touched.
    {
    CONFIG.unlockEverything = false;
    const realGoals = CONFIG.unlockGoals;
    CONFIG.unlockGoals = Object.assign({}, realGoals, { oddsAddict: 500, doublesCharm: 3, loadedDie: 2, reroll: 3, pity: 5 }); // numbers these checks use
    resetProfile();
    const fresh = newShiftState();
    check("New player: Odds Addict, Loaded Shot and The Professor start locked", ["oddsAddict", "loadedShot", "The Professor"].every((id) => fresh.locked.includes(id)), true);
    check("...Hot Hand and Snake Eyes don't", [isUnlocked("hotHand"), isUnlocked("snakeEyes")], [true, true]);
    let leaked = false;
    for (let i = 0; i < 200; i++) {
      const st = newShiftState(); st.roster = ["Lefty", "Dealer Dee", "Hot Rod", "Ghost", "You"];
      if (newStock(st).some((id) => id && st.locked.includes(id))) leaked = true;
      if (newCompStock(st).some((id) => st.locked.includes(id)) || st.locked.includes(randomComp(st))) leaked = true;
      if (newHireOffers(st).some((n) => st.locked.includes(n))) leaked = true;
    }
    check("Locked cards, comps and crew never show up in shops, free comps or hire offers", leaked, false);
    const u = newShiftState(); u.shooterIndex = 0; u.point = 6;
    const oddsWin = [{ bet: "odds", outcome: "win", winnings: 300 }];
    trackRollUnlocks(u, { results: oddsWin, pointHit: true, sevenOut: false, doubles: false, multUsed: 1, shooter: "Lefty" });
    check("$300 won on Odds: Odds Addict still locked", isUnlocked("oddsAddict"), false);
    trackRollUnlocks(u, { results: oddsWin, pointHit: true, sevenOut: false, doubles: false, multUsed: 1, shooter: "Lefty" });
    check("$600 won on Odds: Odds Addict unlocked, and announced once", [isUnlocked("oddsAddict"), takeFreshUnlocks().includes("oddsAddict"), takeFreshUnlocks().length], [true, true, 0]);
    check("...but the run you're on still has it locked (it shows up next run)", [available(u, "oddsAddict"), u.locked.includes("oddsAddict")], [false, true]);
    u.status = "won";
    check("...still locked for the rest of this run", nextShift(u).locked.includes("oddsAddict"), true);
    check("...and available in a new run", newShiftState().locked.includes("oddsAddict"), false);
    const d = newShiftState(); setupTurn(d);
    for (let i = 0; i < 3; i++) trackRollUnlocks(d, { results: [], pointHit: false, sevenOut: false, doubles: true, multUsed: 1, shooter: "Lefty" });
    check("3 doubles in one turn unlocks Doubles Charm", isUnlocked("doublesCharm"), true);
    const w = newShiftState(); w.deposited = 0; w.debt = 100; w.cash = 500; w.shooterIndex = 1; w.shift = 2;
    deposit(w, 100);
    check("Surviving shift 2 unlocks Loaded Die, not Reroll", [isUnlocked("loadedDie"), isUnlocked("reroll")], [true, false]);
    for (let i = 0; i < 5; i++) { const f = newShiftState(); fall(f, "fell-short"); }
    check("The floor opening 5 times unlocks Pit Boss's Pity", isUnlocked("pity"), true);
    const j = newShiftState(); j.roster = ["Jinx", "You"]; j.crew = ["Jinx", "You"];
    removeCrew(j, "Jinx");
    check("Dropping Jinx unlocks Jinx's Shadow", isUnlocked("jinxShadow"), true);
    // Reputation: every 3 unlocks earns the next bonus, for new runs
    resetProfile();
    check("No unlocks: no Reputation bonus", [earnedReputation(), newShiftState().cash], [[], 200]);
    profile().unlocked = ["oddsAddict", "pity", "muggsy"];
    const r1 = newShiftState();
    check("3 unlocks: +$25 starting cash", [earnedReputation(), r1.cash], [["cash"], 225]);
    profile().unlocked = Object.keys(UNLOCKS).slice(0, 12);
    const r4 = newShiftState();
    check("12 unlocks: +1 comp slot, -1 way to roll 7, a starting uncommon card", [compSlots(r4), r4.cards.length, CONFIG.cardRarity[r4.cards[0]], r4.perks], [3, 1, "uncommon", ["minusSeven"]]);
    r4.status = "won";
    const r4next = nextShift(r4);
    check("...bonuses last the whole run (not given again next shift)", [r4next.legacy.length, r4next.cards.length, compSlots(r4next), r4next.perks], [4, 1, 3, ["minusSeven"]]);
    profile().unlocked = Object.keys(UNLOCKS).slice(0, 24);
    const r8 = newShiftState();
    check("24 unlocks: +$75 cash, +1 card slot, -2 ways to roll 7, a Spare Link", [r8.cash, maxCards(r8), r8.perks, r8.cards.includes("chainLink")], [275, 6, ["minusSeven", "minusSeven"], true]);
    resetProfile();
    const before = earnedReputation().length;
    profile().unlocked = ["oddsAddict", "pity"]; profile().counts.falls = 99; CONFIG.unlockGoals.muggsy = 0;
    checkUnlocks();
    check("Reaching a Reputation level is announced with the unlock", takeFreshPerks().includes("cash"), true);
    CONFIG.unlockGoals = realGoals;
    resetProfile();
    check("Reset locks everything again", [isUnlocked("oddsAddict"), isUnlocked("pity")], [false, false]);
    CONFIG.unlockEverything = true;

    // New card bonuses (2026-10-29)
    Object.assign(CONFIG, { leftysGloveMult: 1, frontOfLineMult: 1 });
    const lg = newShiftState(); lg.cards = ["leftysGlove", "frontOfLine"]; lg.crew = ["Lefty", "You"]; lg.shooterIndex = 0; setupTurn(lg);
    check("Lefty's Glove: +1x mult on Lefty's turn", lg.mult, 2);
    lg.shooterIndex = 1; setupTurn(lg, "Lefty", 2);
    check("Front of the Line: +1x mult on your turn", lg.mult, 2);
    Object.assign(CONFIG, { leftysGloveMult: 0, frontOfLineMult: 0 });
    }

    // Dice: 10,000 rolls stay in range, and 7 is the most common total
    const counts = {};
    let inRange = true;
    for (let i = 0; i < 10000; i++) {
      const r = rollDice();
      if (r.total < 2 || r.total > 12 || r.dice[0] + r.dice[1] !== r.total) inRange = false;
      counts[r.total] = (counts[r.total] || 0) + 1;
    }
    check("Dice: 10,000 rolls all between 2 and 12", inRange, true);
    const most = Object.keys(counts).reduce((a, b) => (counts[a] > counts[b] ? a : b));
    check("Dice: 7 is the most common total", most, "7");

    document.getElementById("summary").innerHTML =
      '<span class="pass">' + passed + " passed</span> · " +
      '<span class="' + (failed ? "fail" : "pass") + '">' + failed + " failed</span>";
  </script>
</body>
</html>
