<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chained Dice Tests</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1b1b1b; color: #f2f2f2; padding: 16px; }
    .pass { color: #4cd964; }
    .fail { color: #ff5c5c; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Rule checks</h1>
  <p id="summary"></p>
  <ul id="list"></ul>

  <script src="js/config.js"></script>
  <script src="js/dice.js"></script>
  <script src="js/bets.js"></script>
  <script src="js/crew.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/shift.js"></script>
  <script>
    // Tests use fixed numbers, so tuning config.js doesn't break them.
    CONFIG.shifts[0] = { cash: 200, debt: 2000 };
    const debtState = (debt) => { const st = newShiftState(); st.debt = debt; return st; };
    CONFIG.interestRate = 0.05;

    // Each check prints a green ✔ or a red ✘.
    let passed = 0, failed = 0;
    function check(label, actual, expected) {
      const ok = JSON.stringify(actual) === JSON.stringify(expected);
      ok ? passed++ : failed++;
      const li = document.createElement("li");
      li.className = ok ? "pass" : "fail";
      li.textContent = (ok ? "✔ " : "✘ ") + label + (ok ? "" : "  (got " + JSON.stringify(actual) + ")");
      document.getElementById("list").appendChild(li);
    }

    // Field, $10 bet
    check("Field: 2 pays double", resolveField(10, 2), { outcome: "win", winnings: 20 });
    for (const t of [3, 4, 9, 10, 11]) check("Field: " + t + " pays even", resolveField(10, t), { outcome: "win", winnings: 10 });
    check("Field: 12 pays triple", resolveField(10, 12), { outcome: "win", winnings: 30 });
    for (const t of [5, 6, 7, 8]) check("Field: " + t + " loses", resolveField(10, t).outcome, "lose");

    // Pass Line come-out (point is null), $10 bet
    for (const t of [7, 11]) check("Pass come-out: " + t + " wins $10", resolvePassLine(10, t, null), { outcome: "win", winnings: 10 });
    for (const t of [2, 3, 12]) check("Pass come-out: " + t + " loses", resolvePassLine(10, t, null).outcome, "lose");
    for (const t of [4, 5, 6, 8, 9, 10]) check("Come-out: " + t + " sets the point", nextPoint(null, t), t);
    for (const t of [2, 3, 7, 11, 12]) check("Come-out: " + t + " sets no point", nextPoint(null, t), null);

    // Pass Line with a point of 6, $10 bet
    check("Point 6: rolling 6 wins $10", resolvePassLine(10, 6, 6), { outcome: "win", winnings: 10 });
    check("Point 6: rolling 7 loses (seven out)", resolvePassLine(10, 7, 6).outcome, "lose");
    for (const t of [2, 3, 4, 5, 8, 9, 10, 11, 12]) check("Point 6: rolling " + t + " decides nothing", resolvePassLine(10, t, 6).outcome, "none");
    check("Point 6: hitting it ends the point", nextPoint(6, 6), null);
    check("Point 6: a 7 ends the point", nextPoint(6, 7), null);
    check("Point 6: an 11 keeps the point", nextPoint(6, 11), 6);

    // Odds pay true odds, rounded down
    check("Odds $10 on 4 pays $20 (2:1)", resolveOdds(10, 4, 4).winnings, 20);
    check("Odds $10 on 10 pays $20 (2:1)", resolveOdds(10, 10, 10).winnings, 20);
    check("Odds $10 on 5 pays $15 (3:2)", resolveOdds(10, 5, 5).winnings, 15);
    check("Odds $5 on 9 pays $7 (3:2, rounded down from $7.50)", resolveOdds(5, 9, 9).winnings, 7);
    check("Odds $10 on 6 pays $12 (6:5)", resolveOdds(10, 6, 6).winnings, 12);
    check("Odds $5 on 8 pays $6 (6:5)", resolveOdds(5, 8, 8).winnings, 6);
    check("Odds lose on a seven out", resolveOdds(10, 7, 6).outcome, "lose");
    check("Odds: other numbers decide nothing", resolveOdds(10, 9, 6).outcome, "none");

    // Odds limits (3-4-5x) on a $10 Pass Line
    check("Max odds on 4 is $30 (3x)", maxOdds(10, 4), 30);
    check("Max odds on 5 is $40 (4x)", maxOdds(10, 5), 40);
    check("Max odds on 6 is $50 (5x)", maxOdds(10, 6), 50);

    // Whole rolls
    check("No bets: nothing to settle", resolveRoll({ pass: 0, odds: 0, field: 0 }, 7, null), []);
    const so = resolveRoll({ pass: 10, odds: 20, field: 5 }, 7, 6);
    check("Seven out: Pass, Odds and Field all lose", so.map((r) => r.bet + ":" + r.outcome), ["pass:lose", "odds:lose", "field:lose"]);
    const hit = resolveRoll({ pass: 10, odds: 20, field: 5 }, 4, 4);
    check("Hit point 4: Pass +$10, Odds +$40, Field +$5", hit.map((r) => r.bet + ":" + r.winnings), ["pass:10", "odds:40", "field:5"]);
    check("Odds come back to you after winning; Pass stays up", hit.map((r) => r.staysUp), [true, false, true]);

    // Shift rules
    const s1 = newShiftState();
    check("Shift starts: $200 kitty, $0 paid, shooter 1, on a Dealer break", [s1.kitty, s1.deposited, s1.shooterIndex, s1.onBreak], [200, 0, 0, true]);
    check("Can't roll a come-out with no Pass Line", canRoll(s1), false);
    s1.kitty = 195; s1.bets.pass = 5;
    check("Can roll with $5 on the Pass Line", canRoll(s1), true);

    // Broke
    const broke = newShiftState(); broke.kitty = 4;
    check("$4 total on a come-out is broke", isBroke(broke), true);
    const notBroke = newShiftState(); notBroke.kitty = 0; notBroke.bets.field = 5;
    check("$0 kitty but $5 on the Field is not broke", isBroke(notBroke), false);
    const pointOn = newShiftState(); pointOn.kitty = 0; pointOn.bets.pass = 5; pointOn.point = 6;
    check("$0 kitty with a point on is not broke", isBroke(pointOn), false);
    const paidUp = newShiftState(); paidUp.kitty = 3; paidUp.deposited = 500;
    check("Deposits don't count toward covering a bet", isBroke(paidUp), true);

    // Auto-moving money to the Pass Line
    const mv = newShiftState(); mv.kitty = 2; mv.bets.field = 10;
    check("Kitty $2 + Field $10: $5 Pass moves $3 from Field", fundPassLine(mv, 5), [{ from: "field", amount: 3 }]);
    check("...leaving kitty $0, Field $7, Pass $5", [mv.kitty, mv.bets.field, mv.bets.pass], [0, 7, 5]);
    const mv2 = newShiftState(); mv2.kitty = 50;
    check("Enough in kitty: nothing moved", fundPassLine(mv2, 25), []);
    const mv3 = newShiftState(); mv3.kitty = 2; mv3.bets.field = 2;
    check("Can't cover $5 at all: refused, nothing changes", [fundPassLine(mv3, 5), mv3.kitty, mv3.bets.field], [null, 2, 2]);

    // Paying the dealer
    const d = newShiftState();
    check("Pay $50: $50 paid", deposit(d, 50), 50);
    check("...kitty $150, paid $50, still owe $1,950", [d.kitty, d.deposited, amountOwed(d)], [150, 50, 1950]);
    check("Paying everything keeps $5 back for the Pass Line", deposit(d, 999), 145);
    check("...kitty $5 left", d.kitty, 5);
    check("Kitty at $5: nothing more can be paid", deposit(d, 5), 0);
    const d3 = newShiftState(); d3.kitty = 100; d3.deposited = 1900;
    check("Paying off the whole debt may use every last dollar", [deposit(d3, 100), d3.kitty, d3.status], [100, 0, "won"]);
    const d2 = newShiftState(); d2.kitty = 300; d2.deposited = 1900;
    check("Owe $100 with $300: only $100 is paid", deposit(d2, 300), 100);
    check("Paying in full wins at once, extra stays in kitty", [d2.status, d2.kitty], ["won", 200]);

    // Turns and breaks
    const so1 = newShiftState(); so1.onBreak = false; so1.kitty = 100;
    afterRoll(so1, true);
    check("A seven-out passes the dice and starts a Dealer break", [so1.shooterIndex, so1.onBreak, so1.status], [1, true, "playing"]);
    endBreak(so1);
    check("Leaving the break: next shooter plays", [so1.onBreak, so1.status], [false, "playing"]);

    const last = newShiftState(); last.onBreak = false; last.kitty = 5000; last.shooterIndex = 5;
    afterRoll(last, true);
    check("Last shooter sevens out: a final Dealer break, not a fall yet", [isFinalBreak(last), last.onBreak, last.status], [true, true, "playing"]);
    deposit(last, 5000);
    check("Paying in full on the final break wins", last.status, "won");

    const short = newShiftState(); short.kitty = 500; short.shooterIndex = 6;
    endBreak(short);
    check("Leaving the final break still owing: fall", short.status, "fell-short");

    const brokeRoll = newShiftState(); brokeRoll.onBreak = false; brokeRoll.kitty = 0;
    afterRoll(brokeRoll, false);
    check("Going broke on a come-out: fall", brokeRoll.status, "fell-broke");
    // Interest on paid money
    const in1 = newShiftState(); in1.onBreak = false; in1.kitty = 50; in1.deposited = 100;
    afterRoll(in1, true);
    check("Interest: $100 paid -> +$5 into the kitty at the Break", [in1.lastInterest, in1.kitty], [5, 55]);
    const in2 = newShiftState(); in2.deposited = 30;
    check("Interest rounds down: $30 paid -> $1", payInterest(in2), 1);
    check("Nothing paid -> no interest", payInterest(newShiftState()), 0);
    const in3 = newShiftState(); in3.onBreak = false; in3.kitty = 0; in3.deposited = 100; in3.shooterIndex = 1;
    afterRoll(in3, true);
    check("Interest can save you: $0 kitty + $5 interest -> Break, not a fall", [in3.status, in3.kitty], ["playing", 5]);

    const zero = newShiftState(); zero.onBreak = false; zero.kitty = 0; zero.shooterIndex = 1;
    afterRoll(zero, true);
    check("Seven-out with $0: fall at once, no Dealer break", [zero.status, zero.onBreak], ["fell-broke", false]);
    const low = newShiftState(); low.onBreak = false; low.kitty = 20; low.shooterIndex = 1;
    afterRoll(low, true);
    check("Seven-out with $20: Dealer break as usual", [low.status, low.onBreak], ["playing", true]);
    const brokeBreak = newShiftState(); brokeBreak.kitty = 3; brokeBreak.shooterIndex = 2;
    endBreak(brokeBreak);
    check("Leaving a break unable to cover $5: fall", brokeBreak.status, "fell-broke");

    // Crew dice odds (rounded to 0.1%)
    const pct = (p) => Math.round(p * 1000) / 10;
    const oddsFor = (name) => diceOdds(diceForShooter(name));
    check("Normal dice: 7 is 16.7%", pct(diceOdds()[7]), 16.7);
    check("Hot Rod and You: normal dice", [pct(oddsFor("Hot Rod")[7]), pct(oddsFor("You")[7])], [16.7, 16.7]);
    check("Lefty: 7 is 16%", pct(oddsFor("Lefty")[7]), 16);
    check("Lefty: 11 and 12 are impossible", [oddsFor("Lefty")[11], oddsFor("Lefty")[12]], [0, 0]);
    check("Dealer Dee: 7 is 14.3% (5 of 35 combos)", pct(oddsFor("Dealer Dee")[7]), 14.3);
    check("Jinx: 7 is 22.2%", pct(oddsFor("Jinx")[7]), 22.2);
    check("Jinx: nothing above 8", [9, 10, 11, 12].map((t) => oddsFor("Jinx")[t]), [0, 0, 0, 0]);
    check("Ghost: right die is evens-only or odds-only", ["2,4,6", "1,3,5"].includes(diceForShooter("Ghost").right.join()), true);
    check("Point before 7 on normal dice: 6 is 45.5%", pct(pointBeforeSeven(diceOdds(), 6)), 45.5);
    let deeBanned = false;
    const dee = diceForShooter("Dealer Dee");
    for (let i = 0; i < 5000; i++) { const r = rollDice(dee); if (r.dice[0] === 1 && r.dice[1] === 6) deeBanned = true; }
    check("Dealer Dee: 5,000 rolls, never left 1 + right 6", deeBanned, false);
    let jinxHigh = false;
    for (let i = 0; i < 5000; i++) { if (rollDice(diceForShooter("Jinx")).total > 8) jinxHigh = true; }
    check("Jinx: 5,000 rolls, never above 8", jinxHigh, false);
    const sh = newShiftState(); sh.onBreak = false; sh.kitty = 100;
    afterRoll(sh, true);
    check("After a seven-out, the next shooter's dice are loaded (Lefty -> Dee)", sh.dice.bannedPairs, [[1, 6]]);

    // Mult and crew synergies
    const m = [{ bet: "pass", outcome: "win", winnings: 10 }, { bet: "field", outcome: "win", winnings: 5 }, { bet: "odds", outcome: "lose", winnings: 0 }];
    applyMult(m, 2.5);
    check("Mult 2.5x: $10 win pays $25, $5 win pays $12 (rounded down)", m.map((r) => r.winnings), [25, 12, 0]);

    const atIndex = (i) => { const st = newShiftState(); st.onBreak = false; st.kitty = 100; st.shooterIndex = i; setupTurn(st, null, 1); return st; };
    const rod = atIndex(2);
    applyCrewEffects(rod, [{ bet: "pass", outcome: "win" }], false);
    applyCrewEffects(rod, [{ bet: "field", outcome: "win" }], false);
    applyCrewEffects(rod, [{ bet: "field", outcome: "lose" }], false);
    check("Hot Rod: two winning rolls and a loss -> 3x", rod.mult, 3);
    check("...and the mult lists the reason once: \"Hot Rod streak: +2x\"", multReasons(rod), ["Hot Rod streak: +2x"]);

    const rod2 = atIndex(2); rod2.kitty = 100;
    applyCrewEffects(rod2, [{ bet: "pass", outcome: "lose", amount: 10 }, { bet: "odds", outcome: "lose", amount: 20 }, { bet: "field", outcome: "lose", amount: 5 }], true);
    check("Hot Rod's seven-out costs double: Pass $10 + Odds $20 -> another $30", rod2.kitty, 70);
    applyCrewEffects(rod2, [{ bet: "pass", outcome: "lose", amount: 10 }], true);
    check("...only the first time each shift", rod2.kitty, 70);
    const rod3 = atIndex(2); rod3.kitty = 12;
    applyCrewEffects(rod3, [{ bet: "pass", outcome: "lose", amount: 50 }], true);
    check("...but never below the $5 minimum", rod3.kitty, 5);

    const jinx = atIndex(3); setupTurn(jinx, "Hot Rod", 5);
    check("Mentor: Hot Rod ends at 5x -> Jinx starts at 3x", jinx.mult, 3);
    const jinx2 = atIndex(3); setupTurn(jinx2, "Hot Rod", 1);
    check("Mentor: Hot Rod with no streak -> Jinx starts at 1x", jinx2.mult, 1);

    const ghost = atIndex(4); setupTurn(ghost, "Jinx", 1);
    check("Cold Table: after Jinx, Ghost starts at 0.5x", [ghost.mult, ghost.coldTable], [0.5, true]);
    applyCrewEffects(ghost, [{ bet: "field", outcome: "lose" }], false);
    check("...a loss doesn't lift it", ghost.mult, 0.5);
    applyCrewEffects(ghost, [{ bet: "pass", outcome: "win" }], false);
    check("...the first win lifts it back to 1x", [ghost.mult, ghost.coldTable], [1, false]);

    const flow = newShiftState(); flow.onBreak = false; flow.kitty = 100; flow.shooterIndex = 2; flow.mult = 4;
    afterRoll(flow, true);
    check("Full flow: Hot Rod sevens out at 4x -> Jinx starts at 2.5x", [flow.crew[flow.shooterIndex], flow.mult], ["Jinx", 2.5]);

    // Shop: prices are a share of the debt, rounded to $5
    check("Common = 5% of $2,000 = $100", cardPrice(debtState(2000), "hotHand"), 100);
    check("Uncommon = 10% of $2,000 = $200", cardPrice(debtState(2000), "redDice"), 200);
    check("At a $200 debt: Common $10, Uncommon $20", [cardPrice(debtState(200), "snakeEyes"), cardPrice(debtState(200), "muggsy")], [10, 20]);
    check("Selling gives back half", sellPrice(debtState(2000), "hotHand"), 50);

    const shop = newShiftState();
    check("A new shift has 3 different cards for sale", [shop.stock.length, new Set(shop.stock).size], [3, 3]);
    let ownedInStock = false;
    for (let i = 0; i < 200; i++) {
      const st = newShiftState(); st.cards = ["hotHand", "snakeEyes", "luckySeven", "rattlesnake", "redDice"];
      if (newStock(st).some((id) => st.cards.includes(id))) ownedInStock = true;
    }
    check("Cards you own never show up in the stock", ownedInStock, false);

    const b1 = newShiftState(); b1.kitty = 300; b1.stock = ["hotHand", "redDice", "pity"];
    check("Buy Hot Hand ($100)", [buyCard(b1, 0), b1.kitty, b1.cards, b1.stock[0]], ["ok", 200, ["hotHand"], null]);
    check("Buying the same slot again: sold out", buyCard(b1, 0), "empty");
    check("Can't buy if it would leave less than $5", [buyCard(b1, 1), b1.kitty], ["money", 200]);
    b1.kitty = 205;
    check("...exactly $5 left is fine", [buyCard(b1, 1), b1.kitty], ["ok", 5]);
    const b2 = newShiftState(); b2.kitty = 5000; b2.cards = ["hotHand", "snakeEyes", "luckySeven", "rattlesnake", "redDice"]; b2.stock = ["pity", null, null];
    check("5 cards: slots are full", buyCard(b2, 0), "full");
    check("Sell Snake Eyes for $50", [sellCard(b2, "snakeEyes"), b2.cards.length, b2.kitty], [50, 4, 5050]);
    const sf = newShiftState(); sf.kitty = 1000;
    check("Shuffle costs 5% of the debt every time ($100, then $100)", [shuffleCost(sf), shuffleStock(sf), shuffleCost(sf), sf.kitty], [100, true, 100, 900]);
    check("Shop is closed before the first shooter", isShopOpen(newShiftState()), false);
    const open1 = newShiftState(); open1.shooterIndex = 1;
    check("Shop opens after the first shooter", isShopOpen(open1), true);

    // Cards in play. Helper: a state that owns the given cards.
    const withCards = (...ids) => { const st = newShiftState(); st.onBreak = false; st.kitty = 1000; st.cards = ids; return st; };
    const passLose = (amt) => [{ bet: "pass", outcome: "lose", amount: amt, winnings: 0 }];

    const rd = withCards("redDice");
    const rdRes = resolveRoll({ pass: 10, odds: 0, field: 0 }, 3, null);
    applyCardsBeforePayout(rd, rdRes, 3, null);
    check("Red Dice: come-out 3 wins the $10 Pass Line", [rdRes[0].outcome, rdRes[0].winnings], ["win", 10]);
    const noRd = resolveRoll({ pass: 10, odds: 0, field: 0 }, 3, null);
    applyCardsBeforePayout(withCards(), noRd, 3, null);
    check("Without Red Dice, come-out 3 still loses", noRd[0].outcome, "lose");

    const oa = withCards("oddsAddict");
    const oaRes = resolveRoll({ pass: 10, odds: 10, field: 0 }, 4, 4);
    applyCardsBeforePayout(oa, oaRes, 4, 4);
    check("Odds Addict: $10 Odds on 4 pays $30 instead of $20", oaRes.find((r) => r.bet === "odds").winnings, 30);

    const pt = withCards("pity");
    const ptRes = resolveRoll({ pass: 10, odds: 20, field: 5 }, 7, 6);
    const ptOut = applyCardsBeforePayout(pt, ptRes, 7, 6);
    check("Pity: first seven-out ignored; only the Field loses", [ptOut.pity, ptRes.map((r) => r.bet)], [true, ["field"]]);
    const ptRes2 = resolveRoll({ pass: 10, odds: 0, field: 0 }, 7, 6);
    check("...but only once a shift", applyCardsBeforePayout(pt, ptRes2, 7, 6).pity, false);

    const se = withCards("snakeEyes", "rattlesnake");
    applyCardsAfterRoll(se, [], 2, 6, false);
    check("Snake Eyes: a 2 pays 10% of the debt ($200)", se.kitty, 1200);
    check("Rattlesnake: a 2 adds +1x mult", se.mult, 2);
    check("...and shows as a mult reason", multReasons(se), ["Rattlesnake: +1x"]);

    const ls = withCards("luckySeven");
    applyCardsAfterRoll(ls, [], 7, null, false);
    check("Lucky Seven: a come-out 7 pays 5% ($100)", ls.kitty, 1100);
    applyCardsAfterRoll(ls, [], 7, 6, true);
    check("...but not a seven-out", ls.kitty, 1100);

    const hh = withCards("hotHand");
    applyCardsAfterRoll(hh, [{ bet: "field", outcome: "win" }], 3, null, false);
    applyCardsAfterRoll(hh, [{ bet: "field", outcome: "win" }], 4, null, false);
    check("Hot Hand: 2 wins in a row -> 2x mult", effectiveMult(hh), 2);
    applyCardsAfterRoll(hh, [], 5, 4, false);
    check("...a roll that decides nothing keeps the streak", effectiveMult(hh), 2);
    applyCardsAfterRoll(hh, [{ bet: "field", outcome: "lose", amount: 5 }], 5, 4, false);
    check("...a losing roll resets it", effectiveMult(hh), 1);

    const mg = withCards("muggsy");
    mg.point = 6; applyCardsAfterRoll(mg, [], 6, null, false); // point set
    applyCardsAfterRoll(mg, passLose(10), 7, 6, true);           // seven on the very next roll
    check("Muggsy: point-7 charges another $10", mg.kitty, 990);
    const mgOdds = withCards("muggsy");
    mgOdds.point = 6; applyCardsAfterRoll(mgOdds, [], 6, null, false);
    applyCardsAfterRoll(mgOdds, [{ bet: "pass", outcome: "lose", amount: 10 }, { bet: "odds", outcome: "lose", amount: 50 }], 7, 6, true);
    check("Muggsy charges the Pass Line only, not Odds ($10, not $60)", mgOdds.kitty, 990);
    mg.shooterIndex = 1; setupTurn(mg, "Lefty", 1);
    check("...and the next shooter's winnings are x2", effectiveMult(mg), 2);
    const mg2 = withCards("muggsy");
    mg2.point = 6; applyCardsAfterRoll(mg2, [], 6, null, false);
    applyCardsAfterRoll(mg2, [], 9, 6, false);
    applyCardsAfterRoll(mg2, passLose(10), 7, 6, true);
    check("Muggsy: a 7 two rolls after the point is a normal seven-out", [mg2.kitty, mg2.muggsyPending], [1000, false]);

    // 5b-1 dice cards
    const du = withCards("doubleUp"); du.dice = diceForShooter("Hot Rod"); // normal dice
    const duOdds = diceOdds(currentDice(du));
    check("Double Up, normal dice: 7 drops to 14.3% (6 of 42)", pct(duOdds[7]), 14.3);
    check("Double Up: a 2 goes from 2.8% to 4.8% (2 of 42)", pct(duOdds[2]), 4.8);
    const plainState = withCards(); plainState.dice = diceForShooter("Hot Rod");
    const plainDice = diceOdds(currentDice(plainState));
    check("Without Double Up, dice are unchanged (7 is 16.7%)", pct(plainDice[7]), 16.7);
    const duDee = withCards("doubleUp"); duDee.dice = diceForShooter("Dealer Dee");
    check("Double Up stacks with Dee's sticky dice: 7 is 5 of 41 = 12.2%", pct(diceOdds(currentDice(duDee))[7]), 12.2);
    const lefty = withCards("doubleUp"); lefty.dice = diceForShooter("Lefty");
    check("Double Up never makes Lefty roll a 12", diceOdds(currentDice(lefty))[12], 0);

    const dc = withCards("doublesCharm");
    check("Doubles Charm: rolls 1 and 2 are normal, roll 3 is a pair", [pairDue(dc), (dc.turnRolls = 1, pairDue(dc)), (dc.turnRolls = 2, pairDue(dc))], [false, false, true]);
    check("...then roll 6", [(dc.turnRolls = 4, pairDue(dc)), (dc.turnRolls = 5, pairDue(dc))], [false, true]);
    let allPairs = true, leftySix = false;
    const leftyDice = diceForShooter("Lefty");
    for (let i = 0; i < 2000; i++) {
      const r = rollDice(leftyDice, true);
      if (r.dice[0] !== r.dice[1]) allPairs = false;
      if (r.dice[0] === 6) leftySix = true;
    }
    check("Doubles Charm rolls: 2,000 for Lefty, always pairs, never 6-6", [allPairs, leftySix], [true, false]);
    check("Doubles Charm odds: 7 is impossible on a pair roll", diceOdds(NORMAL_DICE, true)[7], 0);
    const newTurn = withCards(); newTurn.turnRolls = 7; newTurn.shooterIndex = 1; setupTurn(newTurn, "Lefty", 1);
    check("The roll count restarts with each shooter", newTurn.turnRolls, 0);

    const gd = withCards("greenDice");
    applyCardsAfterRoll(gd, [], 12, null, false);
    check("Green Dice: a 12 raises interest from 5% to 5.5%", Math.round(gd.interestRate * 1000) / 10, 5.5);
    applyCardsAfterRoll(gd, [], 11, null, false);
    check("...other totals don't", Math.round(gd.interestRate * 1000) / 10, 5.5);

    check("Rare cards cost 25% of the debt ($500 at $2,000)", cardPrice(debtState(2000), "greenDice"), 500);

    // 5b-2: Loaded Die, Reroll, Cut a chain, Extra chain link
    check("Pit Boss's Pity is now Rare", CONFIG.cardRarity.pity, "rare");
    const cb = withCards(); cb.point = 6; cb.bets = { pass: 10, odds: 20, field: 5 };
    check("Costly roll: a seven-out loses Pass, Odds and Field", costlyBets(cb, 7).map((r) => r.bet), ["pass", "odds", "field"]);
    check("Not costly: a 9 with the point on 6 (Field wins)", costlyBets(cb, 9).length, 0);
    const cbPity = withCards("pity"); cbPity.point = 6; cbPity.bets = { pass: 10, odds: 0, field: 0 };
    check("Not costly: a seven-out Pity would ignore", costlyBets(cbPity, 7).length, 0);
    const cbRed = withCards("redDice"); cbRed.bets = { pass: 10, odds: 0, field: 0 };
    check("Not costly: come-out craps with Red Dice", costlyBets(cbRed, 3).length, 0);

    const rr = withCards("loadedDie", "reroll");
    check("Both rerolls available at first", rerollOptions(rr), { oneDie: true, bothDice: true });
    rr.loadedDieUsed = true; rr.rerollUsed = true;
    rr.shooterIndex = 1; setupTurn(rr, "Lefty", 1);
    check("Next shooter: Reroll is back, Loaded Die stays used (once a shift)", rerollOptions(rr), { oneDie: false, bothDice: true });
    let keptLeft = true;
    for (let i = 0; i < 500; i++) { if (rerollOneDie(NORMAL_DICE, { dice: [4, 3], total: 7 }, 1).dice[0] !== 4) keptLeft = false; }
    check("Loaded Die rerolling the right die keeps the left one", keptLeft, true);

    check("Cut a chain costs 25% of the debt ($50 at $200)", cutChainPrice(debtState(200)), 50);
    const ct = newShiftState(); ct.kitty = 2000; ct.shooterIndex = 2; ct.onBreak = true; // Lefty and Dee have shot
    check("Can cut only crew who haven't shot, never You", cuttableCrew(ct), ["Hot Rod", "Jinx", "Ghost"]);
    check("Can't cut someone who already shot", cutChain(ct, "Lefty"), "not-allowed");
    ct.prevShooterMult = 1;
    check("Cut Hot Rod: $500 paid, Jinx is up next", [cutChain(ct, "Hot Rod"), ct.kitty, ct.crew[ct.shooterIndex]], ["ok", 1500, "Jinx"]);
    check("...and Jinx now rolls Jinx's dice", pct(diceOdds(ct.dice)[7]), 22.2);
    check("...5 seats left", ct.crew.length, 5);
    const ct2 = newShiftState(); ct2.kitty = 2000; ct2.shooterIndex = 4; ct2.onBreak = true; // Ghost is next
    cutChain(ct2, "Ghost");
    check("Cutting the last crew seat before You: You shoot next", ct2.crew[ct2.shooterIndex], "You");
    const ct3 = newShiftState(); ct3.kitty = 500; ct3.shooterIndex = 1;
    check("Cutting can't take the kitty below $5", cutChain(ct3, "Jinx"), "money");

    const cl = newShiftState(); cl.cards = ["chainLink", "hotHand"]; cl.kitty = 50; cl.shooterIndex = 6;
    endBreak(cl);
    check("Extra chain link: falling short becomes a survived shift", [cl.status, cl.savedByLink], ["won", true]);
    check("...and the link is used up", cl.cards, ["hotHand"]);
    const cl2 = newShiftState(); cl2.onBreak = false; cl2.kitty = 0; cl2.cards = ["chainLink"];
    afterRoll(cl2, false);
    check("Extra chain link also saves you from going broke", cl2.status, "won");
    const noLink = newShiftState(); noLink.kitty = 50; noLink.shooterIndex = 6;
    endBreak(noLink);
    check("Without it, you still fall", noLink.status, "fell-short");

    // Milestone 6a: multiple shifts
    check("Shift scale table: shift 3 adds $200 and owes $500", shiftScale(3), { cash: 200, debt: 500 });
    check("After the table: debt x1.5 (rounded to $50), cash +$50", [shiftScale(6), shiftScale(7)], [{ cash: 350, debt: 1800 }, { cash: 400, debt: 2700 }]);
    const s1end = newShiftState(); s1end.kitty = 70; s1end.bets.field = 5; s1end.deposited = 2000; s1end.status = "won";
    s1end.cards = ["hotHand"]; s1end.crew = ["Lefty", "Dealer Dee", "Hot Rod", "Ghost", "You"]; s1end.interestRate = 0.055;
    s1end.pityUsed = true; s1end.loadedDieUsed = true; s1end.hotRodPenaltyUsed = true;
    const s2 = nextShift(s1end);
    check("Next shift: shift 2, owes $300, nothing paid yet", [s2.shift, s2.debt, s2.deposited, s2.status], [2, 300, 0, "playing"]);
    check("...kitty = leftover $75 (incl. the Field bet) + $150", [s2.kitty, s2.bets.field], [225, 0]);
    check("...cards, cut crew and interest carry over", [s2.cards, s2.crew.length, s2.interestRate], [["hotHand"], 5, 0.055]);
    check("...once-a-shift effects reset", [s2.pityUsed, s2.loadedDieUsed, s2.hotRodPenaltyUsed], [false, false, false]);
    check("...starts on a Dealer Break with Lefty up", [s2.onBreak, s2.shooterIndex, s2.crew[0]], [true, 0, "Lefty"]);
    check("Shop is open on shift 2's opening Break", isShopOpen(s2), true);
    check("Prices follow the new debt (Common = 5% of $300 = $15)", cardPrice(s2, "hotHand"), 15);

    // Run stats
    const rs = newShiftState(); rs.kitty = 100;
    recordRoll(rs.stats, rs, { dice: [3, 3], total: 6 }, 40, false, true, diceOdds(), 2, "Hot Rod", 3);
    recordRoll(rs.stats, rs, { dice: [2, 4], total: 6 }, 0, false, false, diceOdds(), 1, "Hot Rod", 4);
    recordRoll(rs.stats, rs, { dice: [3, 4], total: 7 }, -25, true, false, diceOdds(), 1, "Hot Rod", 5);
    const st = rs.stats;
    check("Stats: 3 rolls, 1 double, 1 point hit, 1 seven-out", [st.rolls, st.doubles, st.pointsHit, st.sevenOuts], [3, 1, 1, 1]);
    check("Stats: biggest hit $40, biggest loss $25, won $40, lost $25", [st.biggestHit.amount, st.biggestLoss.amount, st.totalWon, st.totalLost], [40, 25, 40, 25]);
    check("Stats: 2 rolls without a 7, longest turn Hot Rod 5 rolls", [st.bestNoSeven, st.longestTurn], [2, { name: "Hot Rod", rolls: 5 }]);
    check("Stats: expected 7s add up the odds (3 x 1/6 = 0.5)", Math.round(st.expected[7] * 100) / 100, 0.5);
    check("Stats: best shooter Hot Rod +$15, highest mult 2x", [bestShooter(st), st.maxMult], [{ name: "Hot Rod", amount: 15 }, 2]);
    const rs2 = newShiftState(); rs2.kitty = 1000; deposit(rs2, 100); rs2.stock = ["hotHand", null, null]; buyCard(rs2, 0);
    check("Stats: paid $100, spent $100 on a card", [rs2.stats.paid, rs2.stats.spent], [100, 100]);
    rs2.status = "won"; rs2.stats.history.push(1, 2, 3);
    const rs3 = nextShift(rs2);
    check("Stats carry into the next shift and mark where it starts", [rs3.stats.paid, rs3.stats.shiftStarts], [100, [0, 3]]);

    // Dice: 10,000 rolls stay in range, and 7 is the most common total
    const counts = {};
    let inRange = true;
    for (let i = 0; i < 10000; i++) {
      const r = rollDice();
      if (r.total < 2 || r.total > 12 || r.dice[0] + r.dice[1] !== r.total) inRange = false;
      counts[r.total] = (counts[r.total] || 0) + 1;
    }
    check("Dice: 10,000 rolls all between 2 and 12", inRange, true);
    const most = Object.keys(counts).reduce((a, b) => (counts[a] > counts[b] ? a : b));
    check("Dice: 7 is the most common total", most, "7");

    document.getElementById("summary").innerHTML =
      '<span class="pass">' + passed + " passed</span> · " +
      '<span class="' + (failed ? "fail" : "pass") + '">' + failed + " failed</span>";
  </script>
</body>
</html>
