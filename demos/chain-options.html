<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chain Options</title>
<!-- Preview only (not part of the game): three ways to draw the 8-link chain in the top bar. -->
<style>
  body { margin: 0; padding: 16px; background: #0a0807; color: #e9e1cf; font-family: system-ui, sans-serif; }
  h1 { font-family: Georgia, serif; font-size: 1.4rem; margin: 0 0 4px; }
  p.lead { color: #bbb; margin: 0 0 18px; font-size: 0.9rem; }
  .option { background: #17110d; border: 1px solid #3a2a1e; border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; max-width: 760px; }
  .option h2 { margin: 0 0 2px; font-size: 1.1rem; color: #ffd84d; }
  .option .why { color: #bbb; font-size: 0.85rem; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
  .tag { width: 92px; font-size: 0.75rem; color: #999; }
  .bar { display: flex; align-items: center; gap: 8px; background: #1e1611; border-radius: 8px; padding: 6px 10px; }
  .bar .label { font-size: 0.75rem; color: #b5b5b5; }
  .small svg { height: 16px; width: auto; }
  .big svg { height: 54px; width: auto; }
  .phone { width: 340px; background: #120d0a; border: 1px solid #333; border-radius: 10px; padding: 6px 0; display: flex; justify-content: center; align-items: center; gap: 6px; }
  .phone .label { font-size: 0.65rem; color: #b5b5b5; }
  .phone svg { height: 13px; width: auto; }
</style>
</head>
<body>
<h1>Pick a chain</h1>
<p class="lead">How the 8 links could look in the top bar (small), on the end-of-shift screen (big), and on a phone. Shown with 0, 3 and 7 links broken.</p>
<div id="options"></div>

<script>
const IRON = "#c9c9c9", IRON_DARK = "#5d6570", RUST = "#8a4a2a", HOT = "#ff6a2b";

// A: a real interlocking chain seen from the side. Flat links alternate with edge-on links.
// A broken link is shown snapped open, grey.
function chainA(broken, total) {
  const step = 15, h = 20;
  let s = "";
  for (let i = 0; i < total; i++) {
    const x = 11 + i * step, gone = i < broken, col = gone ? "#4a4a4a" : IRON;
    if (i % 2 === 0) {
      // flat link: an oval ring
      if (gone) s += '<ellipse cx="' + x + '" cy="11" rx="10" ry="6.5" fill="none" stroke="' + col + '" stroke-width="2.6" stroke-dasharray="40 12" transform="rotate(10 ' + x + ' 11)"/>';
      else s += '<ellipse cx="' + x + '" cy="10" rx="10" ry="6.5" fill="none" stroke="' + IRON_DARK + '" stroke-width="5"/><ellipse cx="' + x + '" cy="10" rx="10" ry="6.5" fill="none" stroke="' + col + '" stroke-width="2.6"/>';
    } else {
      // edge-on link: a thick bar between two flat links
      if (gone) s += '<rect x="' + (x - 10) + '" y="9" width="8" height="4" rx="2" fill="' + col + '"/><rect x="' + (x + 2) + '" y="10" width="8" height="4" rx="2" fill="' + col + '"/>';
      else s += '<rect x="' + (x - 10) + '" y="7.5" width="20" height="5" rx="2.5" fill="' + IRON + '" stroke="' + IRON_DARK + '" stroke-width="1.5"/>';
    }
  }
  const w = 22 + (total - 1) * step;
  return '<svg viewBox="0 0 ' + w + " " + h + '" xmlns="http://www.w3.org/2000/svg">' + s + "</svg>";
}

// B: heavy iron links ending in a padlock. Broken links fall away (faint outline);
// the padlock springs open once every link is gone.
function chainB(broken, total) {
  const step = 19, h = 24;
  let s = "";
  for (let i = 0; i < total; i++) {
    const x = 3 + i * step;
    if (i < broken) s += '<rect x="' + x + '" y="6" width="20" height="12" rx="6" fill="none" stroke="#3a3330" stroke-width="2" stroke-dasharray="2 3"/>';
    else s += '<rect x="' + x + '" y="6" width="20" height="12" rx="6" fill="none" stroke="#2a2420" stroke-width="6"/>' +
      '<rect x="' + x + '" y="6" width="20" height="12" rx="6" fill="none" stroke="' + IRON + '" stroke-width="3.4"/>' +
      '<path d="M' + (x + 5) + ' 7.5 H' + (x + 15) + '" stroke="#f2f2f2" stroke-width="1" opacity="0.7"/>';
  }
  const px = 3 + total * step + 2, open = broken >= total;
  s += '<path d="M' + (px + 3) + ' 11 V' + (open ? 3 : 7) + ' A5 5 0 0 1 ' + (px + 13) + ' ' + (open ? 1 : 7) + ' V' + (open ? 4 : 11) + '" fill="none" stroke="' + IRON + '" stroke-width="2.6"/>' +
    '<rect x="' + px + '" y="10" width="16" height="13" rx="2.5" fill="#b8892f" stroke="#5a3e12" stroke-width="1.5"/>' +
    '<circle cx="' + (px + 8) + '" cy="15" r="2" fill="#2a1a08"/><rect x="' + (px + 7.2) + '" y="15" width="1.6" height="4.5" fill="#2a1a08"/>';
  return '<svg viewBox="0 0 ' + (px + 18) + " " + h + '" xmlns="http://www.w3.org/2000/svg">' + s + "</svg>";
}

// C: eight separate rings, like a counter. Whole ring = still chained; broken = split open
// with glowing ends. Easiest to count at a glance.
function chainC(broken, total) {
  const step = 22, h = 22;
  let s = "<defs><radialGradient id='g'><stop offset='0' stop-color='" + HOT + "' stop-opacity='0.8'/><stop offset='1' stop-color='" + HOT + "' stop-opacity='0'/></radialGradient></defs>";
  for (let i = 0; i < total; i++) {
    const x = 11 + i * step;
    if (i < broken) {
      s += '<g transform="rotate(18 ' + x + ' 11)" opacity="0.6"><path d="M' + (x + 3) + ' 3.2 A8 8 0 1 0 ' + (x + 7.4) + ' 14" fill="none" stroke="#6a6a6a" stroke-width="3.2" stroke-linecap="round"/>' +
        '<circle cx="' + (x + 3) + '" cy="3.2" r="3" fill="url(#g)"/><circle cx="' + (x + 7.4) + '" cy="14" r="3" fill="url(#g)"/></g>';
    } else {
      s += '<circle cx="' + x + '" cy="11" r="8" fill="none" stroke="' + IRON_DARK + '" stroke-width="5.2"/><circle cx="' + x + '" cy="11" r="8" fill="none" stroke="' + IRON + '" stroke-width="3"/>' +
        '<path d="M' + (x - 5) + ' 5 A8 8 0 0 1 ' + (x + 3) + ' 3.4" fill="none" stroke="#fff" stroke-width="1" opacity="0.6"/>';
    }
  }
  return '<svg viewBox="0 0 ' + (total * step) + " " + h + '" xmlns="http://www.w3.org/2000/svg">' + s + "</svg>";
}

const OPTIONS = [
  ["A. Real chain", "Interlocking links seen from the side, like an actual chain. Broken links hang snapped open in grey.", chainA],
  ["B. Heavy chain and padlock", "Chunky iron links ending in a padlock. Broken links fall away; the padlock springs open when the last one breaks.", chainB],
  ["C. Ring counter", "Eight separate iron rings. A broken ring is split open with hot glowing ends. Easiest to count at a glance.", chainC],
];
let html = "";
for (const [name, why, draw] of OPTIONS) {
  html += '<div class="option"><h2>' + name + '</h2><p class="why">' + why + "</p>";
  for (const b of [0, 3, 7]) html += '<div class="row"><span class="tag">' + b + ' broken</span><span class="bar small">' + draw(b, 8) + '<span class="label">' + b + ' of 8 links broken</span></span></div>';
  html += '<div class="row"><span class="tag">End of shift</span><span class="big">' + draw(3, 8) + "</span></div>";
  html += '<div class="row"><span class="tag">Phone</span><span class="phone">' + draw(3, 8) + '<span class="label">3 of 8 links broken</span></span></div></div>';
}
document.getElementById("options").innerHTML = html;
</script>
</body>
</html>
