<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logo Options</title>
  <style>
    :root { --bg: #111; --card: #1d1d1d; --text: #f0f0f0; --muted: #aaa; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    .intro { color: var(--muted); margin: 0 0 16px; max-width: 900px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .option { background: var(--card); border-radius: 14px; padding: 14px; }
    .option h2 { margin: 0 0 2px; font-size: 1.15rem; }
    .option p { color: var(--muted); font-size: 0.9rem; margin: 0 0 10px; }
    .big { display: flex; justify-content: center; padding: 8px 0; }
    .big svg { width: 200px; height: 200px; }
    .sizes { display: flex; align-items: flex-end; gap: 14px; justify-content: center; margin: 6px 0 12px; color: var(--muted); font-size: 0.75rem; }
    .sizes div { text-align: center; }
    .sizes svg { display: block; margin: 0 auto 3px; }
    .on-light { background: #f3f3f3; border-radius: 8px; padding: 6px; }
    .tab { display: flex; align-items: center; gap: 8px; background: #dee1e6; color: #222; border-radius: 8px 8px 0 0; padding: 6px 10px; width: 220px; font-size: 0.8rem; margin: 0 auto; }
    .tab svg { width: 16px; height: 16px; flex: none; }
    .header { display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 12px; padding: 10px; background: #0c0c0c; border-radius: 10px; }
    .header svg { width: 44px; height: 44px; }
    .header span { font-size: 1.5rem; font-weight: 800; letter-spacing: 2px; }
  </style>
</head>
<body>
  <h1>⛓💀 Logo: C, but darker</h1>
  <p class="intro">Three darker takes on "Break the Chain": a die tearing out of a snapped link, over the pit where you fall. Each is shown big, as an app icon, at browser-tab sizes and next to the title. Pick one, or mix parts.</p>
  <div class="grid" id="grid"></div>

  <script>
    // Dark palette: pit black, ember red, bone dice, rusted iron.
    const C = { black: "#0a0807", pit: "#3a0a06", ember: "#ff4b2b", emberHot: "#ffb347", bone: "#e9e1cf", boneEdge: "#a99e86",
      socket: "#120d0b", blood: "#9e1b14", iron: "#6f6a66", ironDark: "#2b2724", rust: "#8a4a2a", felt: "#0d2a1a" };

    // Background tile: black, with the pit glowing red from below.
    const tile = (id, base = C.black) => `<defs>
        <radialGradient id="pit-${id}" cx="50%" cy="100%" r="80%"><stop offset="0" stop-color="${C.ember}" stop-opacity="0.75"/><stop offset="0.45" stop-color="${C.pit}" stop-opacity="0.7"/><stop offset="1" stop-color="${base}" stop-opacity="0"/></radialGradient>
        <linearGradient id="rust-${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${C.iron}"/><stop offset="0.6" stop-color="${C.rust}"/><stop offset="1" stop-color="${C.ironDark}"/></linearGradient>
      </defs>
      <rect x="4" y="4" width="248" height="248" rx="52" fill="${base}"/>
      <rect x="4" y="4" width="248" height="248" rx="52" fill="url(#pit-${id})"/>
      <rect x="4" y="4" width="248" height="248" rx="52" fill="none" stroke="#5a1410" stroke-width="6"/>`;

    // The snapped link: two rusted half-rings flying apart.
    const brokenLink = (id) => `
      <g transform="rotate(-14 64 136)"><path d="M64 96 A40 40 0 0 0 64 176" fill="none" stroke="${C.ironDark}" stroke-width="26" stroke-linecap="round"/>
        <path d="M64 96 A40 40 0 0 0 64 176" fill="none" stroke="url(#rust-${id})" stroke-width="15" stroke-linecap="round"/></g>
      <g transform="rotate(-14 192 120)"><path d="M192 80 A40 40 0 0 1 192 160" fill="none" stroke="${C.ironDark}" stroke-width="26" stroke-linecap="round"/>
        <path d="M192 80 A40 40 0 0 1 192 160" fill="none" stroke="url(#rust-${id})" stroke-width="15" stroke-linecap="round"/></g>`;

    // Embers instead of gold sparks.
    const embers = `<g stroke-linecap="round">
        <path d="M96 64 L84 44" stroke="${C.ember}" stroke-width="7"/><path d="M118 56 L118 32" stroke="${C.emberHot}" stroke-width="7"/>
        <path d="M140 62 L152 42" stroke="${C.ember}" stroke-width="7"/><path d="M104 210 L92 228" stroke="${C.ember}" stroke-width="6"/>
        <path d="M152 206 L166 224" stroke="${C.emberHot}" stroke-width="6"/></g>
      <circle cx="74" cy="58" r="3.5" fill="${C.emberHot}"/><circle cx="176" cy="216" r="3" fill="${C.ember}"/>`;

    const die = (inner) => `<g transform="rotate(12 128 136)">
        <rect x="80" y="88" width="96" height="96" rx="20" fill="${C.bone}" stroke="${C.boneEdge}" stroke-width="4"/>${inner}</g>`;

    const LOGOS = {
      C1: {
        name: "C1. Pit Glow",
        text: "Black, with the pit glowing red from below. A bone-coloured die tears out of a rusted, snapped link; embers fly instead of gold sparks.",
        svg: (id) => `${tile(id)}${brokenLink(id)}${embers}
          ${die(`<circle cx="106" cy="114" r="10" fill="${C.socket}"/><circle cx="128" cy="136" r="11" fill="${C.blood}"/><circle cx="150" cy="158" r="10" fill="${C.socket}"/>`)}`,
      },
      C2: {
        name: "C2. Skull Die",
        text: "Same pit, but the die shows snake eyes as two hollow eye sockets, with a crack down its face. A die and a skull at once.",
        svg: (id) => `${tile(id)}${brokenLink(id)}${embers}
          ${die(`<ellipse cx="108" cy="122" rx="13" ry="15" fill="${C.socket}"/><ellipse cx="148" cy="122" rx="13" ry="15" fill="${C.socket}"/>
            <circle cx="108" cy="124" r="3.5" fill="${C.ember}"/><circle cx="148" cy="124" r="3.5" fill="${C.ember}"/>
            <path d="M128 140 L122 150 L132 158 L124 172 L130 184" fill="none" stroke="${C.socket}" stroke-width="4" stroke-linejoin="round"/>
            <path d="M108 166 h8 M120 166 h8 M136 166 h8" stroke="${C.socket}" stroke-width="4" stroke-linecap="round"/>`)}`,
      },
      C3: {
        name: "C3. Blood Pip",
        text: "The felt goes almost black; the red pip bleeds down the die. Closest to the original C, just grimmer.",
        svg: (id) => `${tile(id, C.felt)}${brokenLink(id)}${embers}
          ${die(`<circle cx="106" cy="114" r="10" fill="${C.socket}"/><circle cx="150" cy="158" r="10" fill="${C.socket}"/>
            <path d="M128 124 a12 12 0 1 1 -0.1 0 Z" fill="${C.blood}"/>
            <path d="M124 146 C124 158 120 164 121 174 a5 5 0 0 0 10 0 C132 164 130 156 131 146 Z" fill="${C.blood}"/>
            <path d="M117 140 c-2 6 -4 10 -3 16 a3.5 3.5 0 0 0 7 0 c0 -5 -1 -9 -1 -14 Z" fill="${C.blood}"/>`)}`,
      },
    };

    const svg = (key, size, id) => `<svg viewBox="0 0 256 256" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${LOGOS[key].name}">${LOGOS[key].svg(id)}</svg>`;
    let n = 0;
    const grid = document.getElementById("grid");
    for (const key of Object.keys(LOGOS)) {
      const L = LOGOS[key];
      const box = document.createElement("section");
      box.className = "option";
      box.innerHTML = `<h2>${L.name}</h2><p>${L.text}</p>
        <div class="big">${svg(key, 200, "big" + key)}</div>
        <div class="sizes">
          <div>${svg(key, 64, "a" + n++)}app icon</div>
          <div>${svg(key, 32, "b" + n++)}32 px</div>
          <div>${svg(key, 16, "c" + n++)}16 px</div>
          <div class="on-light">${svg(key, 32, "d" + n++)}on light</div>
        </div>
        <div class="tab">${svg(key, 16, "e" + n++)} Chained Dice</div>
        <div class="header">${svg(key, 44, "f" + n++)}<span>CHAINED DICE</span></div>`;
      grid.appendChild(box);
    }
  </script>
</body>
</html>
